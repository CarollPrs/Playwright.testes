<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Clientes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }

    input:focus {
      border-color: #0066cc;
      outline: none;
    }

    .error-message {
      color: #d9534f;
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0052a3;
    }

    .success-message {
      margin-top: 16px;
      padding: 10px;
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      border-radius: 4px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Cadastro de Cliente</h2>
    
    <form id="clientForm" novalidate>
      <div class="form-group">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" placeholder="Digite seu nome">
        <span class="error-message" id="erro-nome">O campo Nome é obrigatório.</span>
      </div>

      <div class="form-group">
        <label for="sobrenome">Sobrenome *</label>
        <input type="text" id="sobrenome" placeholder="Digite seu sobrenome">
        <span class="error-message" id="erro-sobrenome">O campo Sobrenome é obrigatório.</span>
      </div>

      <div class="form-group">
        <label for="nascimento">Data de Nascimento</label>
        <input type="date" id="nascimento">
      </div>

      <div class="form-group">
        <label for="endereco">Endereço</label>
        <input type="text" id="endereco" placeholder="Rua, número, bairro...">
      </div>

      <button type="button" id="btnSalvar">Salvar</button>
      
      <div class="success-message" id="mensagem-sucesso">
        Cliente cadastrado com sucesso!
      </div>
    </form>
  </div>

  <script>
    document.getElementById('btnSalvar').addEventListener('click', function() {
      const nomeInput = document.getElementById('nome');
      const sobrenomeInput = document.getElementById('sobrenome');
      
      const erroNome = document.getElementById('erro-nome');
      const erroSobrenome = document.getElementById('erro-sobrenome');
      const mensagemSucesso = document.getElementById('mensagem-sucesso');

      let isValid = true;

      // Reseta mensagens visíveis
      erroNome.style.display = 'none';
      erroSobrenome.style.display = 'none';
      mensagemSucesso.style.display = 'none';

      // Validação do Nome
      if (!nomeInput.value.trim()) {
        erroNome.style.display = 'block';
        isValid = false;
      }

      // Validação do Sobrenome
      if (!sobrenomeInput.value.trim()) {
        erroSobrenome.style.display = 'block';
        isValid = false;
      }

      // Se tudo estiver válido
      if (isValid) {
        mensagemSucesso.style.display = 'block';
        
        // Exemplo: Limpar formulário após salvar
        // document.getElementById('clientForm').reset();
      }
    });
  </script>

</body>
</html>
